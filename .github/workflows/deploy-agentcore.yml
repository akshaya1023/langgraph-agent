name: Build and Deploy LangGraph Agent to Bedrock AgentCore

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "Dockerfile"
      - "cloudformation/**"
      - ".github/workflows/deploy-agentcore.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for GitHub OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: langgraph-nova-agent
  BOOTSTRAP_STACK_NAME: langgraph-nova-agent-bootstrap
  RUNTIME_STACK_NAME: langgraph-nova-agent-runtime
  AGENT_RUNTIME_NAME: langgraph_nova_hello_world
  BEDROCK_MODEL_ID: amazon.nova-lite-v1:0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------------
      # 1. Bootstrap infra (ECR repo + AgentCore execution role).
      #    Idempotent: only makes changes the first time, or when the
      #    bootstrap template itself changes.
      # ---------------------------------------------------------------
      - name: Deploy bootstrap stack (ECR repo + execution role)
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/bootstrap.yaml \
            --stack-name "${BOOTSTRAP_STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides RepositoryName="${ECR_REPOSITORY}" \
            --no-fail-on-empty-changeset

      - name: Read bootstrap stack outputs
        id: bootstrap
        run: |
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name "${BOOTSTRAP_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text)
          ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${BOOTSTRAP_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ExecutionRoleArn'].OutputValue" \
            --output text)
          echo "repo_uri=${REPO_URI}" >> "$GITHUB_OUTPUT"
          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 2. Build and push the image FIRST - the AgentCore Runtime
      #    resource cannot be created/updated to point at an image
      #    that doesn't exist in ECR yet.
      # ---------------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image to ECR
        id: build-image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${{ steps.bootstrap.outputs.repo_uri }}:${IMAGE_TAG}"

          docker buildx build \
            --platform linux/arm64 \
            -t "${IMAGE_URI}" \
            -t "${{ steps.bootstrap.outputs.repo_uri }}:latest" \
            --push \
            .

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Wait for Amazon Inspector scan
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "Waiting for Inspector image scan to complete..."
          for i in $(seq 1 20); do
            STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id imageTag="${IMAGE_TAG}" \
              --region "${AWS_REGION}" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")
            echo "  scan status: ${STATUS}"
            if [ "${STATUS}" = "COMPLETE" ]; then break; fi
            if [ "${STATUS}" = "FAILED" ]; then echo "Image scan failed"; exit 1; fi
            sleep 15
          done

      # ---------------------------------------------------------------
      # 3. Deploy the AgentCore Runtime stack.
      #    First ever run  -> CREATE_COMPLETE (creates the Runtime).
      #    Every run after -> UPDATE_COMPLETE (points ContainerUri at
      #                       the new image; no-interruption update).
      # ---------------------------------------------------------------
      - name: Deploy / update AgentCore Runtime via CloudFormation
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/agentcore-runtime.yaml \
            --stack-name "${RUNTIME_STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
                AgentRuntimeName="${AGENT_RUNTIME_NAME}" \
                ImageUri="${{ steps.build-image.outputs.image_uri }}" \
                ExecutionRoleArn="${{ steps.bootstrap.outputs.role_arn }}" \
                BedrockModelId="${BEDROCK_MODEL_ID}" \
            --no-fail-on-empty-changeset

      - name: Read AgentCore Runtime ARN
        id: runtime
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name "${RUNTIME_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='AgentRuntimeArn'].OutputValue" \
            --output text)
          echo "agent_runtime_arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed agent
        run: |
          cat > payload.json <<EOF
          {
            "prompt": "Say hello and tell me what model powers you."
          }
          EOF

          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "${{ steps.runtime.outputs.agent_runtime_arn }}" \
            --content-type "application/json" \
            --accept "application/json" \
            --cli-binary-format raw-in-base64-out \
            --payload file://payload.json \
            --region "${AWS_REGION}" \
            response.json

          echo "===== Agent Response ====="
          cat response.json

      - name: Summary
        run: |
          echo "### Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ steps.build-image.outputs.image_uri }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Agent Runtime ARN: ${{ steps.runtime.outputs.agent_runtime_arn }}" >> "$GITHUB_STEP_SUMMARY"
